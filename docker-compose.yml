services:
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "5173:5173"
      # HMR runs on its own port (see vite.config.ts); unpublishing it left the
      # browser with a dead websocket and no hot reload in Docker.
      - "24678:24678"
    volumes:
      - /app/node_modules
      - .:/app
    environment:
      - NODE_ENV=development
      - DOCKER=true
      - VITE_API_URL=http://localhost:3000
    env_file:
      - apps/web/.env
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app/apps/web
          ignore:
            - "node_modules/"
            - "dist/"
            - ".git/"
            - "*.log"
        - action: rebuild
          path: ./apps/web/package.json
          target: /app/apps/web/package.json
        - action: rebuild
          path: ./bun.lock
          target: /app/bun.lock

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules
      - .:/app
    environment:
      - NODE_ENV=development
      - PORT=3000
    env_file:
      - apps/api/.env
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app/apps/api
          ignore:
            - "node_modules/"
            - "dist/"
            - ".git/"
            - "*.log"
        - action: rebuild
          path: ./apps/api/package.json
          target: /app/apps/api/package.json
        - action: rebuild
          path: ./bun.lock
          target: /app/bun.lock
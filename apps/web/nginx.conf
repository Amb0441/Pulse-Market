server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 8m;

    # Docker's embedded DNS. Used together with the variable form of proxy_pass
    # below so the API hostname is resolved per request instead of once at
    # startup. That has two consequences worth having:
    #   - `nginx -t` succeeds outside a compose network, so the config can be
    #     validated in CI before it is ever deployed;
    #   - if the api container is recreated with a new IP, nginx picks it up
    #     without being restarted. A static `upstream` block would keep sending
    #     traffic to the dead address until someone reloaded nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers are NOT included at the server level, even though nginx
    # would inherit them into every location that declares no add_header of its
    # own.
    #
    # That inheritance is what was double-issuing them: /api/ and the realtime
    # location inherited this block while the API's helmet middleware was
    # already sending the same headers, so responses carried `nosniff nosniff`,
    # `DENY DENY` and two different Content-Security-Policies - one allowing
    # unpkg, the other not. Browsers intersect multiple CSPs, so the stricter
    # silently won, but scanners report it and the intent was unreadable.
    #
    # Split by who owns the response instead: nginx sets the headers on the HTML
    # and static files it serves itself (see `location /` and each static
    # block), and helmet sets them on API responses in dev and prod alike. Each
    # response now carries exactly one policy.

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # --- health ------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- realtime stream ----------------------------------------------------
    # Server-sent events. nginx buffers proxied responses by default, which is
    # right for ordinary API calls and breaks this one completely: each pushed
    # frame would sit in the proxy buffer until it happened to fill, so the
    # stream would look connected and deliver nothing, with no error to trace
    # it from. The API also sends `X-Accel-Buffering: no`, but that header is
    # only honoured for responses nginx is not already buffering, so the
    # directive is set here too rather than trusted alone.
    #
    # Declared as a regex so it covers both `/api/realtime` and the versioned
    # `/api/v1/realtime`. A regex location is evaluated ahead of the `/api/`
    # prefix below, so this one wins for these paths.
    location ~ ^/api/(v\d+/)?realtime$ {
        set $pulse_api "http://api:3000";
        proxy_pass $pulse_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        # The API emits a heartbeat comment every 25s. The read timeout is the
        # ceiling on how long the upstream may stay silent, so it has to sit
        # well above that gap: too tight and nginx hangs up on a perfectly
        # healthy stream, which the client would see only as a silent drop.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- API proxy ---------------------------------------------------------
    location /api/ {
        # The variable form of proxy_pass defers name resolution to request time
        # (see the resolver directive above). Because the URL is a variable, the
        # request URI must be appended explicitly - nginx will not do it
        # automatically in this form.
        set $pulse_api "http://api:3000";
        proxy_pass $pulse_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API sets `trust proxy` and rate-limits by IP, so the real client
        # address must survive the hop. Without this every request would look
        # like it came from the nginx container and share one rate-limit bucket.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Errors from the API are JSON with a useful status code. Converting them
        # to a bare 502 hides the real cause from both the user and the logs.
        proxy_intercept_errors off;
    }

    # --- service worker ----------------------------------------------------
    # Never cached, or clients keep running an old app indefinitely. No
    # `expires` here: it would emit a second, conflicting Cache-Control header
    # alongside the add_header below.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        types { } default_type application/javascript;
    }

    location = /manifest.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { } default_type application/manifest+json;
    }

    # index.html must not be cached either, or a deploy never reaches anyone
    # whose service worker is already installed.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # --- static assets -----------------------------------------------------
    # Vite fingerprints these filenames, so they are safe to cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /icons/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # --- SPA fallback ------------------------------------------------------
    # Client-side routes such as /privacy must return index.html rather than
    # 404, or a refresh on a deep link breaks.
    #
    # This is the location that serves the document, so it is where the security
    # headers have to be: CSP only governs the response it rides on, and the
    # browser never sees one attached to an API call. Declared here rather than
    # at the server level so that /api/ does not inherit a second copy on top of
    # helmet's.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}

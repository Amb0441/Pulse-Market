<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Pulse Market — Hyper-Local Neighborhood Marketplace</title>
    <meta name="description" content="Buy and sell with your neighbors. Post an item in seconds and browse what is for sale nearby on Pulse Market." />
    <meta property="og:title" content="Pulse Market — Hyper-Local Neighborhood Marketplace" />
    <meta property="og:description" content="Buy and sell with your neighbors. Post an item in seconds and browse what is for sale nearby on Pulse Market." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      CSP for `vite dev`, where there is no server to send response headers from.

      Vite copies index.html into dist/ untouched apart from rewriting the script
      src, so this tag ships to production too. Browser policies are additive, so
      where Pages also sends a Content-Security-Policy header the effective policy
      is the INTERSECTION of the two - this file is the stricter of them and any
      source it omits is blocked even if public/_headers allows it. The two must
      therefore stay in step; public/_headers is the copy meant for production.

      Listing photos are Cloudinary URLs, so img-src must allow res.cloudinary.com.
      Locally the browser talks to same-origin /api (Vite proxies to :3000).
      __CSP_API_ORIGIN__ is replaced at build with VITE_API_URL when that is set
      (Cloudflare Pages); it is stripped when empty so this tag stays valid in
      `vite dev`. ws://localhost:24678 is Vite HMR only.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://res.cloudinary.com https://*.supabase.co https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' __CSP_API_ORIGIN__http://127.0.0.1:3000 http://localhost:3000 https://*.supabase.co wss://*.supabase.co ws://localhost:24678 https://tile.openstreetmap.org https://*.tile.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'">

    <!-- PWA: black-translucent draws under the status bar so safe-area padding
         can paint a continuous header instead of a stacked web chrome strip. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#cf4a2a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pulse Market" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192x192.svg" />
    <link rel="icon" type="image/svg+xml" href="/icons/badge-72x72.svg" sizes="72x72" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">

    <!-- Leaflet is bundled through Vite (see MapView/LocationPicker) rather than
         loaded from a CDN: a third-party <script> runs with the full privileges
         of this origin, and the CSP had to whitelist unpkg.com to allow it. -->
  </head>
  <body class="h-full bg-paper text-ink font-['DM_Sans',sans-serif] antialiased selection:bg-clay selection:text-white">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>

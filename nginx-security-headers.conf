# Security headers, kept in one file because nginx's add_header is NOT additive:
# a location block that declares any add_header discards every add_header
# inherited from the server level. Declaring them once here and including this
# file in each location that also sets Cache-Control is the only way to be sure
# none of them get silently dropped.
#
# This file is included per location, never at the server level: /api/ responses
# are covered by the API's own helmet middleware, and including it globally made
# every API response carry two CSPs and `nosniff nosniff`. One response, one
# policy.
#
# Google Fonts is still an external origin, because the stylesheet is linked from
# index.html. Leaflet no longer is: it is bundled from node_modules, so scripts
# are `'self'` only. The only remaining `<script>` in index.html carries a `src`,
# so there is no inline script left to justify `'unsafe-inline'`.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://res.cloudinary.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' https://tile.openstreetmap.org https://*.tile.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

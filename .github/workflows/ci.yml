name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (typecheck, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Install from the committed lockfile only. A drifting lockfile must fail
      # rather than silently resolve to different (possibly vulnerable) versions.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      # Dependency scanning: high/critical advisories fail the build.
      - name: Audit dependencies
        run: bun audit --audit-level=high

  frontend:
    name: frontend (typecheck, build, secret scan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # Fails if any VITE_* secret or backend credential can reach the browser.
      - name: Scan for leaked secrets
        run: bun run scan:secrets

      - name: Audit dependencies
        run: bun audit --audit-level=high

  containers:
    name: containers (non-root, no latest tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tag both images explicitly. Building without -t leaves a dangling image
      # with no name, so the "run as non-root" assertions below would fail with
      # "Unable to find image" rather than testing anything real.
      - name: Build backend image
        run: docker build -t pulse-market-backend -f backend/Dockerfile.dev backend

      - name: Build frontend image
        run: docker build -t pulse-market-frontend -f Dockerfile.dev .

      # A container running as root turns any image-layer flaw into host
      # compromise, so this is enforced rather than left to convention.
      - name: Assert images do not run as root
        run: |
          for image in pulse-market-backend pulse-market-frontend; do
            uid=$(docker run --rm --entrypoint sh "$image" -c 'id -u')
            if [ "$uid" = "0" ]; then
              echo "::error::$image runs as root (uid 0)"
              exit 1
            fi
            echo "$image runs as uid $uid"
          done

      # The backend image must refuse to boot without a real Supabase config
      # rather than silently serving mock data. Booting it here proves the
      # fail-fast guard survives the Docker build.
      #
      # The command is overridden deliberately: the image's CMD is
      # `bun --watch src/server.ts`, and the watcher process stays alive after the
      # app crashes, so the container would hang instead of failing this step.
      - name: Assert backend refuses to boot without secrets
        run: |
          set +e
          docker run --rm --entrypoint bun \
            -e NODE_ENV=production -e PORT=3000 \
            pulse-market-backend run src/server.ts > /tmp/boot.log 2>&1
          status=$?
          set -e
          cat /tmp/boot.log
          if [ "$status" -eq 0 ]; then
            echo "::error::backend booted without Supabase credentials"
            exit 1
          fi
          if ! grep -q "SUPABASE_URL" /tmp/boot.log; then
            echo "::error::backend failed, but not with the expected credential error"
            exit 1
          fi
          echo "backend correctly refused to boot without credentials (exit $status)"

  # The images that actually ship. A launch-day surprise here is much worse than
  # a red build today: the dev images above say nothing about whether nginx
  # config is valid or the production bundles install cleanly.
  production-images:
    name: production images (build, config valid, runs non-root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production API image
        run: docker build -t pulse-market-api -f backend/Dockerfile backend

      - name: Build production web image
        run: docker build -t pulse-market-web -f Dockerfile .

      # The API holds the Supabase service-role key and talks to Cloudinary, so
      # it must not run as root. nginx is deliberately excluded: its master
      # process is root by design so it can bind :80, and its workers drop to
      # the unprivileged nginx user.
      - name: Assert API image does not run as root
        run: |
          uid=$(docker run --rm --entrypoint sh pulse-market-api -c 'id -u')
          if [ "$uid" = "0" ]; then
            echo "::error::pulse-market-api runs as root (uid 0)"
            exit 1
          fi
          echo "pulse-market-api runs as uid $uid"

      # `nginx -t` parses the config and the included security-header snippet.
      # A typo in either only surfaces at container start otherwise, which is
      # the worst possible moment to find out.
      - name: Validate nginx configuration
        run: docker run --rm --entrypoint nginx pulse-market-web -t

      # A bad add_header target or an unreadable include would make nginx fail
      # to start. Boot it for real and confirm it serves.
      - name: Assert web image serves
        run: |
          set -e
          cid=$(docker run -d --name pm-web-smoke -p 18080:80 pulse-market-web)
          trap 'docker rm -f pm-web-smoke >/dev/null' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          # The security headers must survive on the document itself. nginx's
          # add_header is not additive, so a location that sets Cache-Control
          # silently drops every inherited header unless the snippet is
          # re-included; that regression is invisible without this assertion.
          headers=$(curl -fsSI http://127.0.0.1:18080/)
          for h in content-security-policy x-frame-options x-content-type-options referrer-policy; do
            echo "$headers" | grep -qi "^$h:" || { echo "::error::$h missing from /"; exit 1; }
          done
          # A client-side route must fall back to index.html, not 404.
          curl -fsS http://127.0.0.1:18080/privacy | grep -q 'id="root"' \
            || { echo "::error::SPA fallback broken for /privacy"; exit 1; }
          echo "production web image serves correctly with security headers"
